<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payroll & Produksi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #f8fafc; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border-line: #e2e8f0; --p-color: #0f172a; --blue: #3b82f6; --red: #ef4444; --green: #10b981; }
        [data-theme="dark"] { --bg-main: #090d16; --bg-card: #111827; --text-main: #f3f4f6; --text-muted: #9ca3af; --border-line: #1f2937; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--bg-main); padding: 12px; padding-bottom: 80px; color: var(--text-main); font-size: 14px; box-sizing: border-box; }
        
        .header-bon { background: var(--bg-card); border: 1.5px solid var(--border-line); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .header-bon-left { display: flex; align-items: center; gap: 10px; }
        .header-bon-logo { width: 36px; height: 36px; background: var(--bg-main); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; border: 1px solid var(--border-line); }
        .header-bon-logo img { width: 100%; height: 100%; object-fit: contain; }
        .header-bon-info h3 { margin: 0; font-size: 14px; color: var(--p-color); font-weight: 800; }
        .header-bon-info p { margin: 0; font-size: 11px; color: var(--text-muted); font-weight: 600; }
        
        .header-bon-right { display: flex; align-items: center; gap: 8px; }
        .btn-theme { background: var(--bg-main); border: 1px solid var(--border-line); width: 34px; height: 34px; border-radius: 8px; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-logout { background: #fee2e2; color: #ef4444; border: none; padding: 8px 10px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 11px; }

        .link-dashboard { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); text-decoration: none; font-weight: 700; font-size: 13px; margin-bottom: 10px; }
        .link-dashboard:hover { text-decoration: underline; }

        .card { background: var(--bg-card); padding: 14px; border-radius: 14px; border: 1.5px solid var(--border-line); max-width: 600px; margin: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); box-sizing: border-box; }
        
        .header-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-line); padding-bottom: 10px; margin-bottom: 14px; }
        .header-title h3 { margin: 0; color: var(--p-color); font-size: 16px; font-weight: 800; }

        .tab-container { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { padding: 9px 12px; background: var(--bg-main); border: 1.5px solid var(--border-line); border-radius: 8px; font-weight: 800; cursor: pointer; color: var(--text-muted); font-family: inherit; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
        .tab-btn.active { background: var(--p-color); color: white; border-color: var(--p-color); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px; }
        .stat-box { background: var(--bg-main); border: 1.5px solid var(--border-line); padding: 8px; border-radius: 10px; text-align: center; }
        .stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; margin-bottom: 2px; }
        .stat-value { font-size: 13px; font-weight: 800; color: var(--text-main); }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: 800; font-size: 10px; margin-bottom: 3px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        select, input { width: 100%; padding: 10px 11px; border: 1.5px solid var(--border-line); border-radius: 9px; box-sizing: border-box; font-family: inherit; background: var(--bg-card); color: var(--text-main); font-weight: 700; font-size: 13px; outline: none; }
        select:focus, input:focus { border-color: var(--blue); }

        .production-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .prod-item-box { background: var(--bg-main); border: 1.5px solid var(--border-line); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
        .prod-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .prod-col { display: flex; flex-direction: column; gap: 2px; }
        .prod-col label { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .prod-col input { padding: 8px; border: 1.5px solid var(--border-line); border-radius: 7px; background: var(--bg-card); color: var(--text-main); font-weight: 800; font-size: 14px; text-align: center; width: 100%; box-sizing: border-box; }

        .btn-action { background: var(--green); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 14px; width: 100%; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .bon-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .bon-card { background: var(--bg-main); border: 1.5px solid var(--border-line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .bon-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border-line); padding-bottom: 5px; }
        .bon-rincian-item { font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-weight: 600; padding: 2px 0; }
        .bon-rincian-item span b { color: var(--text-main); }
        .bon-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-line); padding-top: 6px; font-weight: 800; }

        .bt-panel { margin-bottom: 10px; background: var(--bg-main); padding: 8px; border-radius: 9px; border: 1.5px solid var(--border-line); text-align: center; }
        #btnConnectBT { background: var(--blue); color: white; border: none; padding: 7px 10px; border-radius: 7px; font-weight: 800; cursor: pointer; font-size: 11px; width: 100%; }
        #statusBT { font-size: 10px; font-weight: 800; margin-top: 4px; display: block; color: var(--red); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: var(--bg-card); width: min(95vw, 420px); max-height: 90vh; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1.5px solid var(--border-line); }
        .modal-header { padding: 12px 14px; background: var(--p-color); color: white; font-weight: 800; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .modal-body { padding: 14px; overflow-y: auto; background: var(--bg-main); display: flex; flex-direction: column; }
        .modal-footer { padding: 12px 14px; border-top: 1.5px solid var(--border-line); display: flex; justify-content: flex-end; gap: 8px; background: var(--bg-card); flex-wrap: wrap; }
        
        .thermal-receipt { background: #fff; color: #000; padding: 10px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; line-height: 1.3; box-shadow: 0 0 10px rgba(0,0,0,0.05); margin: 0 auto; width: 100%; }
        .thermal-receipt.w80 { max-width: 80mm; font-size: 11px; }
        .thermal-receipt.w58 { max-width: 58mm; font-size: 9px; }
        .receipt-center { text-align: center; }
        .receipt-line { border-bottom: 1px dashed #000; margin: 5px 0; }
        .receipt-row { display: flex; justify-content: space-between; }
    </style>
</head>
<body>


<div class="card">
    <a href="dashboard_karyawan.html" class="link-dashboard">← Kembali ke Dashboard Karyawan</a>
    
    <div class="header-title">
        <h3>👷‍♂️ Payroll & Produksi</h3>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('input', event)">1. Input Harian</button>
        <button class="tab-btn" onclick="switchTab('setting', event)">2. Setting Harga</button>
        <button class="tab-btn" onclick="switchTab('rekap', event)">3. Rekap Total</button>
        <button class="tab-btn" onclick="switchTab('slip', event)">4. Slip Gaji</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Sesi Hari Ini</div>
            <div class="stat-value" id="statTotalInput">0 Sesi</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Upah</div>
            <div class="stat-value" id="statTotalUpah" style="color:var(--green);">Rp 0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Lembur</div>
            <div class="stat-value" id="statTotalLembur">0 Pcs</div>
        </div>
    </div>

    <div id="tab-input" class="tab-content active">
        <div class="form-group">
            <label>Tanggal Produksi</label>
            <input type="date" id="inTanggal">
        </div>
        <div class="form-group">
            <label>Nama Karyawan</label>
            <select id="inKaryawan"><option value="">-- Pilih Karyawan --</option></select>
        </div>

        <div style="font-weight: 800; margin: 14px 0 8px; color: var(--p-color); text-transform: uppercase; font-size: 12px;">Jumlah Hasil Produksi:</div>
        
        <div class="production-grid" id="containerInputProduksi"></div>

        <button class="btn-action" onclick="simpanInputHarian()">💾 Simpan Hasil Produksi</button>
    </div>

    <div id="tab-setting" class="tab-content">
        <div class="form-group">
            <label>Pilih Karyawan</label>
            <select id="settingKaryawan" onchange="muatDropdownSettingKaryawan()"><option value="">-- Pilih Karyawan --</option></select>
        </div>

        <div style="font-weight: 800; margin: 14px 0 8px; color: var(--p-color); text-transform: uppercase; font-size: 12px;">Atur Tarif per Jenis Pekerjaan (Rp):</div>

        <div class="production-grid" id="containerSettingHarga"></div>

        <button class="btn-action" style="background: var(--blue);" onclick="simpanSettingHarga()">💾 Simpan Tarif Khusus</button>
    </div>

    <div id="tab-rekap" class="tab-content">
        <div class="form-group"><label>Dari Tanggal</label><input type="date" id="rekapMulai"></div>
        <div class="form-group"><label>Sampai Tanggal</label><input type="date" id="rekapSelesai"></div>
        <button class="btn-action" style="background: var(--p-color); margin-bottom: 10px;" onclick="muatRekap()">🔍 Tampilkan Rekap Global</button>
        
        <div id="tabelRekapBody" class="bon-list">
            <div style="text-align: center; color: var(--text-muted); font-weight: 700; padding: 15px;">Silakan pilih tanggal dan klik tampilkan rekap.</div>
        </div>
    </div>

    <div id="tab-slip" class="tab-content">
        <div class="bt-panel">
            <button id="btnConnectBT" onclick="connectBT()">🔗 HUBUNGKAN PRINTER BLUETOOTH</button>
            <small id="statusBT">Status: Terputus</small>
        </div>

        <div class="form-group">
            <label>Pilih Karyawan</label>
            <select id="slipKaryawan"><option value="">-- Pilih Karyawan --</option></select>
        </div>
        <div style="display:flex; gap:8px;">
            <div class="form-group" style="flex:1;"><label>Mulai</label><input type="date" id="slipMulai"></div>
            <div class="form-group" style="flex:1;"><label>Sampai</label><input type="date" id="slipSelesai"></div>
        </div>
        <div class="form-group">
            <label>Ukuran Kertas Thermal</label>
            <select id="slipUkuranKertas">
                <option value="80">Thermal 80 mm</option>
                <option value="58" selected>Thermal 58 mm</option>
            </select>
        </div>

        <!-- FORM PENDAPATAN LAIN / BONUS (DINAMIS MOBILE) -->
        <div style="margin-top: 15px; background: rgba(59, 130, 246, 0.05); padding: 12px; border-radius: 8px; border: 1px dashed var(--blue);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <strong style="color: var(--blue); font-size: 12px;">Pendapatan Lain (Opsional)</strong>
                <button class="btn-action" style="background: var(--blue); padding: 6px 10px; font-size: 10px; width:auto;" onclick="tambahBarisBonus()">+ Tambah</button>
            </div>
            <div id="bonusContainer">
                <div class="bonus-row" style="display: flex; gap: 6px; align-items: flex-end; margin-bottom: 8px;">
                    <div style="flex: 2;"><label style="color: var(--blue);">Keterangan</label><input type="text" class="in-bonus-desc" placeholder="Contoh: Bonus"></div>
                    <div style="flex: 1.5;"><label style="color: var(--blue);">Nominal (Rp)</label><input type="text" class="in-bonus-amount" placeholder="0" oninput="formatRibuan(this)"></div>
                    <button class="btn-action" style="background: var(--red); height: 38px; width: 38px; padding:0; display: flex; justify-content: center; align-items: center;" onclick="hapusBarisBonus(this)">✕</button>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;">
            <button class="btn-action" style="background: var(--p-color);" onclick="previewSlipGaji()">👁️ Preview</button>
            <button class="btn-action" style="background: var(--blue);" onclick="cetakBluetoothDirect()">🖨️ Cetak BT</button>
        </div>
        <button class="btn-action" id="btnReprint" style="background: #f59e0b; margin-top:8px; display:none;" onclick="reprintLast()">🔄 REPRINT SLIP</button>
    </div>

</div>

<!-- MODAL RINCIAN HARIAN REKAP -->
<div class="modal-overlay" id="modalRincian">
    <div class="modal-card">
        <div class="modal-header">
            <span id="modalRincianTitle">Rincian Harian</span>
            <span onclick="document.getElementById('modalRincian').style.display='none'" style="cursor:pointer; font-size:16px;">✕</span>
        </div>
        <div class="modal-body" id="modalRincianBody">
            <!-- Tabel rincian harian -->
        </div>
        <div class="modal-footer">
            <button class="btn-action" style="background: var(--text-muted); padding: 7px 10px; font-size:11px; width: auto;" onclick="document.getElementById('modalRincian').style.display='none'">Tutup</button>
        </div>
    </div>
</div>

<!-- MODAL PREVIEW STRUK -->
<div class="modal-overlay" id="modalPreview">
    <div class="modal-card">
        <div class="modal-header">
            <span id="modalTitle">Preview Slip</span>
            <span onclick="document.getElementById('modalPreview').style.display='none'" style="cursor:pointer; font-size:16px;">✕</span>
        </div>
        <div class="modal-body" id="modalPreviewBody" style="align-items: center;"></div>
        <div class="modal-footer">
            <button class="btn-action" style="background: var(--text-muted); padding: 7px 10px; font-size:11px; width: auto;" onclick="document.getElementById('modalPreview').style.display='none'">Tutup</button>
            <button class="btn-action" style="background: var(--blue); padding: 7px 10px; font-size:11px; width: auto;" onclick="cetakBluetoothDirect()">🖨️ Cetak BT</button>
        </div>
    </div>
</div>

<script>
             const SB_URL = "https://brxwhppefkycvghjqklh.supabase.co";
            const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeHdocHBlZmt5Y3ZnaGpxa2xoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzA4MzUsImV4cCI6MjA5OTYwNjgzNX0.aRymB9Fybz0UsiR8blMvun608m5EPxNk29UlF5PSjhg";
            const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let namaTokoGlobal = "Toko Saya";
    let tokoIdGlobal = null; 
    let btCharacteristic = null;
    let globalRekapKaryawan = {}; 
    let globalTarifMap = {}; 
    let lastPrintCommands = [];

    const ITEM_LABELS = {
        'goreng': 'Goreng', 'kemas_pendek': 'Kemas Pendek', 'kemas_panjang': 'Kemas Panjang',
        'pack_opp10': 'Pack OPP 10', 'pack_opp12': 'Pack OPP 12', 'pack_toples': 'Pack Toples',
        'pack_karakter': 'Pack Karakter', 'repack_makaroni': 'Repack Makaroni', 'press': 'Press'
    };

    function autoSelect(input) { setTimeout(() => input.select(), 50); }
    function autoZero(input) { if (input.value.trim() === '') { input.value = '0'; } }
    function formatRibuan(input) { let val = input.value.replace(/[^0-9]/g, ''); input.value = val ? parseInt(val).toLocaleString('id-ID') : ''; }
    function bersihFormat(val) { return val ? parseInt(val.replace(/\./g, '')) || 0 : 0; }

    function getLocalToday() {
        let d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
    }

    function initTheme() { 
        if (localStorage.getItem('themeMode') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark'); 
        } 
    }
    initTheme();

    function switchTab(tabId, evt) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
        if(tabId === 'setting') muatDropdownSettingKaryawan();
    }

    let tglHariIni = getLocalToday();
    document.getElementById('inTanggal').value = tglHariIni;
    document.getElementById('rekapMulai').value = tglHariIni;
    document.getElementById('rekapSelesai').value = tglHariIni;
    document.getElementById('slipMulai').value = tglHariIni;
    document.getElementById('slipSelesai').value = tglHariIni;

    function renderDinamisForm() {
        let htmlInput = '';
        let htmlSetting = '';
        let idx = 1;
        for(let key in ITEM_LABELS) {
            let label = ITEM_LABELS[key];
            htmlInput += `
                <div class="prod-item-box">
                    <span style="font-size:11px; font-weight:800; color:var(--text-main);">${idx}. ${label.toUpperCase()}</span>
                    <div class="prod-row">
                        <div class="prod-col"><label>Normal</label><input type="number" id="q_${key}" value="0" onfocus="autoSelect(this)" onblur="autoZero(this)"></div>
                        <div class="prod-col"><label>Lembur</label><input type="number" id="l_${key}" value="0" onfocus="autoSelect(this)" onblur="autoZero(this)"></div>
                    </div>
                </div>
            `;
            htmlSetting += `
                <div class="prod-item-box">
                    <span style="font-size:11px; font-weight:800; color:var(--text-main);">${idx}. ${label.toUpperCase()}</span>
                    <div class="prod-row">
                        <div class="prod-col"><label>Tarif Normal</label><input type="text" id="h_${key}" value="0" onfocus="autoSelect(this)" onblur="autoZero(this)" oninput="formatRibuan(this)"></div>
                        <div class="prod-col"><label>Tarif Lembur</label><input type="text" id="hl_${key}" value="0" onfocus="autoSelect(this)" onblur="autoZero(this)" oninput="formatRibuan(this)"></div>
                    </div>
                </div>
            `;
            idx++;
        }
        document.getElementById('containerInputProduksi').innerHTML = htmlInput;
        document.getElementById('containerSettingHarga').innerHTML = htmlSetting;
    }
    renderDinamisForm();

    // FUNGSI BONUS DINAMIS MOBILE
    function tambahBarisBonus() {
        const container = document.getElementById('bonusContainer');
        const newRow = document.createElement('div');
        newRow.className = 'bonus-row';
        newRow.style = 'display: flex; gap: 6px; align-items: flex-end; margin-bottom: 8px;';
        newRow.innerHTML = `
            <div style="flex: 2;"><label style="color: var(--blue);">Keterangan</label><input type="text" class="in-bonus-desc" placeholder="Contoh: Bonus"></div>
            <div style="flex: 1.5;"><label style="color: var(--blue);">Nominal</label><input type="text" class="in-bonus-amount" placeholder="0" oninput="formatRibuan(this)"></div>
            <button class="btn-action" style="background: var(--red); height: 38px; width: 38px; padding:0; display: flex; justify-content: center; align-items: center;" onclick="hapusBarisBonus(this)">✕</button>
        `;
        container.appendChild(newRow);
    }
    function hapusBarisBonus(btn) { btn.parentElement.remove(); }

    async function initData() {
        const { data: sessionData } = await _supabase.auth.getSession();
        if (sessionData && sessionData.session) {
            const { data: profile } = await _supabase.from('profiles').select('toko_id, nama_lengkap').eq('id', sessionData.session.user.id).single();
            if (profile) {
                tokoIdGlobal = profile.toko_id;
                if (profile.toko_id) {
                    const { data: toko } = await _supabase.from('toko').select('nama_toko').eq('id', profile.toko_id).single();
                    if (toko && toko.nama_toko) { namaTokoGlobal = toko.nama_toko; }
                }
            }
        }

        const { data: karyawan } = await _supabase.from('karyawan').select('*').eq('toko_id', tokoIdGlobal).eq('aktif', true);
        if(karyawan) {
            let opt = '<option value="ALL">🌟 SEMUA KARYAWAN</option>';
            karyawan.forEach(k => { opt += `<option value="${k.id}">${k.nama_karyawan}</option>`; });
            document.getElementById('inKaryawan').innerHTML = '<option value="">-- Pilih Karyawan --</option>' + opt.replace('<option value="ALL">🌟 SEMUA KARYAWAN</option>', '');
            document.getElementById('slipKaryawan').innerHTML = opt;
            document.getElementById('settingKaryawan').innerHTML = '<option value="">-- Pilih Karyawan --</option>' + opt.replace('<option value="ALL">🌟 SEMUA KARYAWAN</option>', '');
        }
        muatStatistikHariIni();
    }

    async function muatStatistikHariIni() {
        let tglHariIni = getLocalToday();
        
        const [resProd, resTarif] = await Promise.all([
            _supabase.from('produksi_harian').select('*').eq('tanggal', tglHariIni).eq('toko_id', tokoIdGlobal),
            _supabase.from('tarif_karyawan').select('*').eq('toko_id', tokoIdGlobal)
        ]);

        let tarifMap = {};
        if (resTarif.data) {
            resTarif.data.forEach(t => {
                if(!tarifMap[t.karyawan_id]) tarifMap[t.karyawan_id] = {};
                tarifMap[t.karyawan_id][t.kategori] = Number(t.tarif);
            });
        }

        if(resProd.data) {
            let totalSesi = resProd.data.length;
            let totalUpahDinamis = 0;
            let totalLembur = 0;
            let items = Object.keys(ITEM_LABELS);

            resProd.data.forEach(curr => {
                let kId = curr.karyawan_id;
                let t = tarifMap[kId] || {};
                
                items.forEach(k => {
                    let q = Number(curr['q_' + k] || 0);
                    let l = Number(curr['l_' + k] || 0);
                    totalLembur += l;
                    totalUpahDinamis += (q * (t[k] || 0)) + (l * (t['lembur_' + k] || 0));
                });
            });

            document.getElementById('statTotalInput').innerText = totalSesi + " Sesi";
            document.getElementById('statTotalUpah').innerText = "Rp " + totalUpahDinamis.toLocaleString('id-ID');
            document.getElementById('statTotalLembur').innerText = totalLembur.toLocaleString('id-ID') + " Pcs";
        }
    }

    async function muatDropdownSettingKaryawan() {
        let kId = document.getElementById('settingKaryawan').value;
        for(let k in ITEM_LABELS) {
            if(document.getElementById('h_' + k)) document.getElementById('h_' + k).value = 0;
            if(document.getElementById('hl_' + k)) document.getElementById('hl_' + k).value = 0;
        }
        if(!kId) return;

        const { data } = await _supabase.from('tarif_karyawan').select('*').eq('karyawan_id', kId);
        if(data) {
            data.forEach(s => {
                if (s.kategori.startsWith('lembur_')) {
                    let itemId = s.kategori.replace('lembur_', '');
                    let el = document.getElementById('hl_' + itemId);
                    if(el) el.value = Number(s.tarif).toLocaleString('id-ID');
                } else {
                    let el = document.getElementById('h_' + s.kategori);
                    if(el) el.value = Number(s.tarif).toLocaleString('id-ID');
                }
            });
        }
    }

    async function simpanSettingHarga() {
        let kId = document.getElementById('settingKaryawan').value;
        if(!kId) { alert("Silakan pilih karyawan terlebih dahulu!"); return; }

        let payloads = [];
        for(let k in ITEM_LABELS) {
            let valNormal = bersihFormat(document.getElementById('h_' + k).value);
            let valLembur = bersihFormat(document.getElementById('hl_' + k).value);
            
            payloads.push({ toko_id: tokoIdGlobal, karyawan_id: kId, kategori: k, tarif: valNormal });
            payloads.push({ toko_id: tokoIdGlobal, karyawan_id: kId, kategori: 'lembur_' + k, tarif: valLembur });
        }

        await _supabase.from('tarif_karyawan').upsert(payloads, { onConflict: 'karyawan_id,kategori' });
        alert("✅ Tarif Khusus berhasil disimpan!");
        muatStatistikHariIni();
    }

    async function simpanInputHarian() {
        let tanggal = document.getElementById('inTanggal').value;
        let karyawan_id = document.getElementById('inKaryawan').value;

        if(!tanggal || !karyawan_id) { alert("Tanggal dan Karyawan wajib dipilih!"); return; }

        let q = {}; let l = {};
        for(let item in ITEM_LABELS) {
            q[item] = parseInt(document.getElementById('q_' + item).value) || 0;
            l[item] = parseInt(document.getElementById('l_' + item).value) || 0;
        }

        const { data: setTarif } = await _supabase.from('tarif_karyawan').select('*').eq('karyawan_id', karyawan_id);
        let tarif = {};
        if(setTarif) { setTarif.forEach(s => { tarif[s.kategori] = Number(s.tarif); }); }

        let total_upah = 0;
        for(let item in ITEM_LABELS) {
            let h_normal = tarif[item] || 0;
            let h_lembur = tarif['lembur_' + item] || 0; 
            total_upah += (q[item] * h_normal) + (l[item] * h_lembur);
        }

        let payload = { toko_id: tokoIdGlobal, tanggal, karyawan_id, total_upah };
        for(let item in ITEM_LABELS) {
            payload['q_' + item] = q[item];
            payload['l_' + item] = l[item];
        }

        const { error } = await _supabase.from('produksi_harian').insert([payload]);
        if(error) {
            alert("Gagal menyimpan: " + error.message);
        } else {
            alert("✅ Sukses! Hasil produksi tersimpan.");
            muatStatistikHariIni();
            for(let item in ITEM_LABELS) {
                document.getElementById('q_' + item).value = 0;
                document.getElementById('l_' + item).value = 0;
            }
        }
    }

    async function muatRekap() {
        let mulai = document.getElementById('rekapMulai').value;
        let selesai = document.getElementById('rekapSelesai').value;

        const { data, error } = await _supabase
            .from('produksi_harian')
            .select(`*, karyawan:karyawan_id (*)`)
            .gte('tanggal', mulai)
            .lte('tanggal', selesai)
            .order('tanggal', { ascending: false });

        let container = document.getElementById('tabelRekapBody');
        if (error) { container.innerHTML = `<div style="text-align: center; color: var(--red); padding: 15px;">Gagal memuat rekap</div>`; return; }

        const { data: tarifData } = await _supabase.from('tarif_karyawan').select('*');
        let tarifMap = {};
        if (tarifData) {
            tarifData.forEach(t => {
                if(!tarifMap[t.karyawan_id]) tarifMap[t.karyawan_id] = {};
                tarifMap[t.karyawan_id][t.kategori] = Number(t.tarif);
            });
        }
        globalTarifMap = tarifMap;

        container.innerHTML = '';
        if (!data || data.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 15px; font-weight:700;">Tidak ada data pada rentang tanggal tersebut.</div>`;
            return;
        }

        let items = Object.keys(ITEM_LABELS);
        let grouped = {};

        data.forEach(row => {
            let kId = row.karyawan_id;
            if(!grouped[kId]) {
                grouped[kId] = {
                    karyawan_id: kId,
                    nama: row.karyawan?.nama_karyawan || row.karyawan?.nama || 'Karyawan',
                    rows: [], 
                    agg: {} 
                };
                items.forEach(i => { grouped[kId].agg['q_'+i] = 0; grouped[kId].agg['l_'+i] = 0; });
            }
            grouped[kId].rows.push(row);
            
            items.forEach(i => {
                grouped[kId].agg['q_'+i] += Number(row['q_'+i]||0);
                grouped[kId].agg['l_'+i] += Number(row['l_'+i]||0);
            });
        });

        globalRekapKaryawan = grouped; 

        for (let kId in grouped) {
            let emp = grouped[kId];
            let t = tarifMap[kId] || {};
            let rincianProdHtml = '', rincianLemburHtml = '';
            let totRP = 0, totRL = 0;

            items.forEach(i => {
                let qty = emp.agg['q_' + i];
                let lmb = emp.agg['l_' + i];
                if (qty > 0) {
                    let sub = qty * (t[i] || 0);
                    totRP += sub;
                    rincianProdHtml += `<div class="bon-rincian-item"><span>${ITEM_LABELS[i]} (${qty}x)</span><span>Rp ${sub.toLocaleString('id-ID')}</span></div>`;
                }
                if (lmb > 0) {
                    let subL = lmb * (t['lembur_' + i] || 0);
                    totRL += subL;
                    rincianLemburHtml += `<div class="bon-rincian-item"><span>[Lembur] ${ITEM_LABELS[i]} (${lmb}x)</span><span style="color:var(--blue);">Rp ${subL.toLocaleString('id-ID')}</span></div>`;
                }
            });

            if(!rincianProdHtml) rincianProdHtml = '<div style="font-size:11px; color:var(--text-muted);">Tidak ada produksi</div>';
            if(!rincianLemburHtml) rincianLemburHtml = '<div style="font-size:11px; color:var(--text-muted);">Tidak ada lembur</div>';
            let grandTotalGaji = totRP + totRL;

            container.innerHTML += `
                <div class="bon-card">
                    <div class="bon-header">
                        <span style="font-weight:800; font-size:14px; color:var(--p-color);">${emp.nama}</span>
                        <span style="font-weight:700; font-size:11px; color:var(--text-muted);">${mulai} s/d ${selesai}</span>
                    </div>
                    <div style="font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-top:5px;">Total Produksi:</div>
                    ${rincianProdHtml}
                    <div style="font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-top:5px;">Total Lembur:</div>
                    ${rincianLemburHtml}
                    <div class="bon-footer" style="margin-top:8px;">
                        <span style="font-size:12px; color:var(--text-muted);">Total Gaji:</span>
                        <span style="font-size:16px; color:var(--green);">Rp ${grandTotalGaji.toLocaleString('id-ID')}</span>
                    </div>
                    <button class="btn-action" style="background:var(--blue); padding: 8px; margin-top:5px; font-size:11px;" onclick="bukaRincianRekap('${kId}')">👁️ Lihat Rincian per Hari</button>
                </div>`;
        }
    }

    function bukaRincianRekap(kId) {
        let emp = globalRekapKaryawan[kId];
        if(!emp) return;
        
        document.getElementById('modalRincianTitle').innerText = emp.nama;
        let t = globalTarifMap[kId] || {}; 
        let items = Object.keys(ITEM_LABELS);
        let html = '';
        
        emp.rows.forEach(r => {
            let detail = '';
            let dayUpahDinamis = 0;

            items.forEach(i => {
                let qty = Number(r['q_' + i] || 0);
                let lmb = Number(r['l_' + i] || 0);
                if(qty > 0) {
                    detail += `<div class="bon-rincian-item"><span>${ITEM_LABELS[i]} (${qty}x)</span></div>`;
                    dayUpahDinamis += (qty * (t[i] || 0));

            `;

        document.getElementById('modalRincianBody').innerHTML = html;

    async function connectBT() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
            });
            const server = await device.gatt.connect();
            const services = await server.getPrimaryServices();
            let targetCharacteristic = null;

            for (let service of services) {
                try {
                    const characteristics = await service.getCharacteristics();
                    targetCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                    if (targetCharacteristic) break;
                } catch (err) {
                    console.warn("Lewati service terkunci:", err);
                }
            }

            if (!targetCharacteristic) throw new Error("Karakteristik write printer tidak ditemukan.");
            
            btCharacteristic = targetCharacteristic;
            document.getElementById('statusBT').innerText = "Status: Terhubung (" + device.name + ")";
            document.getElementById('statusBT').style.color = "#10b981";
            alert("✅ Printer Bluetooth Berhasil Terhubung!");
        } catch (e) { 
            alert("Koneksi Bluetooth Gagal: " + e.message); 
        }
    }

    async function printToBT(textCommands) {
        if (!btCharacteristic) throw new Error("Printer belum terhubung! Silakan klik Hubungkan Printer Bluetooth.");
        let encoder = new TextEncoder();
        let bytes = encoder.encode(textCommands);
        for (let i = 0; i < bytes.length; i += 20) {
            let chunk = bytes.slice(i, i + 20);
            await btCharacteristic.writeValue(chunk);
            await new Promise(r => setTimeout(r, 30));
        }
    }

    async function generateSlipPayload() {
        let kId = document.getElementById('slipKaryawan').value;
        let mulai = document.getElementById('slipMulai').value;
        let selesai = document.getElementById('slipSelesai').value;
        let ukuran = document.getElementById('slipUkuranKertas').value;

        // Ambil Data Bonus Multibaris
        let bonusArr = [];
        document.querySelectorAll('.bonus-row').forEach(row => {
            let desc = row.querySelector('.in-bonus-desc').value.trim() || 'Pendapatan Lain';
            let amount = bersihFormat(row.querySelector('.in-bonus-amount').value);
            if (amount !== 0) { bonusArr.push({ desc: desc, amount: amount }); }
        });

        if(!kId) { alert("Silakan pilih karyawan terlebih dahulu!"); return null; }

        let query = _supabase.from('produksi_harian').select(`*, karyawan:karyawan_id (*)`).gte('tanggal', mulai).lte('tanggal', selesai);
        if(kId !== 'ALL') { query = query.eq('karyawan_id', kId); }

        let { data, error } = await query;
        if(error || !data || data.length === 0) { alert("Tidak ada data slip gaji pada rentang tanggal tersebut."); return null; }

        const { data: tarifData } = await _supabase.from('tarif_karyawan').select('*');
        let tarifMap = {};
        if (tarifData) {
            tarifData.forEach(t => {
                if(!tarifMap[t.karyawan_id]) tarifMap[t.karyawan_id] = {};
                tarifMap[t.karyawan_id][t.kategori] = Number(t.tarif);
            });
        }

        let htmlContent = '';
        let allRawCommands = "";

        const ESC = '\x1B', GS = '\x1D', INIT = ESC + '@';
        const ALIGN_CENTER = ESC + 'a' + '\x01', ALIGN_LEFT = ESC + 'a' + '\x00';
        const BOLD_ON = ESC + 'E' + '\x01', BOLD_OFF = ESC + 'E' + '\x00';
        const CUT_PAPER = GS + 'V' + '\x41' + '\x03';

        let maxChar = (ukuran === '58') ? 32 : 48;
        let lineDashed = '-'.repeat(maxChar);

        function padRow(left, right, maxLen) {
            let spaces = maxLen - (left.length + right.length);
            if (spaces < 1) spaces = 1;
            return left + ' '.repeat(spaces) + right;
        }

        let grouped = {};
        let items = Object.keys(ITEM_LABELS);
        
        data.forEach(row => {
            let kid = row.karyawan_id;
            if(!grouped[kid]) {
                grouped[kid] = { nama: row.karyawan?.nama_karyawan || row.karyawan?.nama || 'Karyawan', agg: {} };
                items.forEach(i => { grouped[kid].agg['q_'+i] = 0; grouped[kid].agg['l_'+i] = 0; });
            }
            items.forEach(i => {
                grouped[kid].agg['q_'+i] += Number(row['q_'+i]||0);
                grouped[kid].agg['l_'+i] += Number(row['l_'+i]||0);
            });
        });

        for (let kid in grouped) {
            let emp = grouped[kid];
            let t = tarifMap[kid] || {};
            let grandTotal = 0;
            let detailHtml = '';
            let textBuffer = '';

            textBuffer += INIT + ALIGN_CENTER + BOLD_ON + namaTokoGlobal + '\n';
            textBuffer += 'SLIP GAJI PRODUKSI (' + ukuran + 'mm)\n';
            textBuffer += 'Periode: ' + mulai + ' s/d ' + selesai + '\n' + BOLD_OFF;
            textBuffer += lineDashed + '\n';
            textBuffer += ALIGN_LEFT + 'Karyawan: ' + emp.nama + '\n';
            textBuffer += lineDashed + '\n';

            items.forEach(i => {
                let q = emp.agg['q_' + i];
                let l = emp.agg['l_' + i];
                
                if(q > 0) {
                    let sub = q * (t[i] || 0);
                    grandTotal += sub;
                    let lineStr = `- ${ITEM_LABELS[i]} (${q}x)`;
                    let priceStr = `Rp ${sub.toLocaleString('id-ID')}`;
                    textBuffer += padRow(lineStr, priceStr, maxChar) + '\n';
                    detailHtml += `<div class="receipt-row"><span>${lineStr}</span><span>${priceStr}</span></div>`;
                }
                if(l > 0) {
                    let subL = l * (t['lembur_' + i] || 0);
                    grandTotal += subL;
                    let lineStr = `  [Lembur] ${ITEM_LABELS[i]} (${l}x)`;
                    let priceStr = `Rp ${subL.toLocaleString('id-ID')}`;
                    textBuffer += padRow(lineStr, priceStr, maxChar) + '\n';
                    detailHtml += `<div class="receipt-row" style="color:var(--blue);"><span>${lineStr}</span><span>${priceStr}</span></div>`;
                }
            });

            // Tambahkan Bonus Dinamis
            if (bonusArr.length > 0) {
                textBuffer += lineDashed + '\n'; 
                detailHtml += `<div class="receipt-line"></div>`;
                bonusArr.forEach(b => {
                    grandTotal += b.amount;
                    let lineStr = `+ ${b.desc}`;
                    let priceStr = `Rp ${b.amount.toLocaleString('id-ID')}`;
                    textBuffer += padRow(lineStr, priceStr, maxChar) + '\n';
                    detailHtml += `<div class="receipt-row" style="color:var(--blue);"><span>${lineStr}</span><span>${priceStr}</span></div>`;
                });
            }

            let totalStr = `Rp ${grandTotal.toLocaleString('id-ID')}`;
            textBuffer += lineDashed + '\n';
            textBuffer += BOLD_ON + padRow('TOTAL GAJI', totalStr, maxChar) + '\n' + BOLD_OFF;
            textBuffer += lineDashed + '\n';
            textBuffer += ALIGN_CENTER + 'Terima Kasih!\n\n\n' + CUT_PAPER;

            allRawCommands += textBuffer;

            htmlContent += `
            <div class="thermal-receipt w${ukuran}">
                <div class="receipt-center"><b>${namaTokoGlobal}</b></div>
                <div class="receipt-center" style="font-size:8px;">SLIP GAJI (${ukuran}mm)</div>
                <div class="receipt-center" style="font-size:8px;">Periode: ${mulai} s/d ${selesai}</div>
                <div class="receipt-line"></div>
                <div><b>Karyawan: ${emp.nama}</b></div>
                <div class="receipt-line"></div>
                ${detailHtml}
                <div class="receipt-line"></div>
                <div class="receipt-row" style="font-size:10px;"><b>TOTAL GAJI</b><b>Rp ${grandTotal.toLocaleString('id-ID')}</b></div>
                <div class="receipt-line"></div>
                <div class="receipt-center" style="font-size:8px; margin-top:4px;">Terima Kasih!</div>
            </div>
            `;
        }

        return { htmlContent, rawCommands: allRawCommands };
    }

    async function previewSlipGaji() {
        let res = await generateSlipPayload();
        if(!res) return;
        let ukuran = document.getElementById('slipUkuranKertas').value;

        document.getElementById('modalTitle').innerText = `Preview Slip (${ukuran}mm)`;
        document.getElementById('modalPreviewBody').innerHTML = res.htmlContent;
        document.getElementById('modalPreview').style.display = 'flex';
    }

    async function cetakBluetoothDirect() {
        let res = await generateSlipPayload();
        if(!res) return;

        try {
            if (!btCharacteristic) {
                await connectBT();
                if (!btCharacteristic) return;
            }

            await printToBT(res.rawCommands);
            lastPrintCommands = res.rawCommands;
            document.getElementById('btnReprint').style.display = 'block';
            alert("✅ Berhasil dicetak melalui Printer Bluetooth!");
            document.getElementById('modalPreview').style.display = 'none';
        } catch (error) {
            console.error(error);
            alert("Gagal mencetak via Bluetooth: " + error.message);
        }
    }

    async function reprintLast() {
        if (!lastPrintCommands) return alert("Belum ada data cetak terakhir!");
        try {
            if (!btCharacteristic) {
                await connectBT();
                if (!btCharacteristic) return;
            }
            await printToBT(lastPrintCommands);
            alert("✅ Berhasil Reprint Slip Gaji!");
        } catch (e) {
            alert("Reprint Gagal: " + e.message);
        }
    }
