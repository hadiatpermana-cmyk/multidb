<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBRdigital | Form Laporan Pengiriman Barang</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --accent: #1ba0e2; --text: #333333; --input-bg: #ffffff; --border: #cbd5e0; }
        body { font-family: 'Roboto Condensed', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 100px; }
        
        /* HEADER DENGAN LOGO DINAMIS DARI PENGATURAN TOKO */
        .header { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .logo-box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .header-text { text-align: right; }
        .header-text h2 { font-size: 18px; color: var(--accent); margin: 0; text-transform: uppercase; font-weight: 700; }
        .header-text h2 span { color: #27c24c; }
        .header-text p { font-size: 11px; color: #666; margin: 3px 0 0 0; }

        .section-title { font-size: 12px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin: 20px 0 10px 5px; letter-spacing: 1px; }
        .card-form { background: var(--card); padding: 18px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        label { display: block; font-size: 15px; margin-bottom: 8px; color: var(--text); font-weight: bold; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; box-sizing: border-box; font-weight: bold; }
        
        .nota-container { background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 5px; margin-bottom: 15px; max-height: 350px; overflow-y: auto; }
        .nota-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); gap: 15px; }
        .nota-item:last-child { border-bottom: none; }
        .nota-item input[type="checkbox"] { width: 28px; height: 28px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
        .nota-info { flex: 1; }
        .txt-tgl { font-size: 13px; color: #7f8c8d; display: block; margin-bottom: 4px; border-bottom: 1px dashed var(--border); padding-bottom: 2px; }
        .baris-bawah { display: flex; justify-content: space-between; gap: 10px; }
        .txt-agen { font-size: 15px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        .txt-nota { font-size: 15px; color: #2c3e50; font-weight: 700; }
        
        .readonly-auto { color: #d97706 !important; font-weight: bold; background: #fffdf5 !important; }
        .btn-kirim { width: 100%; padding: 16px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent) 0%, #2980b9 100%); color: white; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(27, 160, 226, 0.3); }
        .select-sumber { border: 1px solid #d97706 !important; color: #d97706 !important; font-weight: bold; background: #fffdf5 !important; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-box" id="logoContainer">
        <span style="font-size: 20px;">🏪</span>
    </div>
    <div class="header-text">
        <h2 id="judulNamaToko">LAPORAN <span>PENGIRIMAN</span></h2>
        <p>Sistem Operasional Armada Toko</p>
    </div>
</div>
 <a href="dashboard_karyawan.html" class="link-dashboard">← Kembali ke Dashboard</a>
<div class="section-title">📦 PILIH ARMADA & NOTA PENGIRIMAN</div>
<div class="card-form">
    <label>PILIH KENDARAAN / ARMADA</label>
    <select id="selMobil" onchange="cariNotaPengiriman()"><option value="">-- Pilih Kendaraan --</option></select>

    <label>DAFTAR NOTA PENGIRIMAN AKTIF</label>
    <div id="notaList" class="nota-container">
        <div style="color:#7f8c8d; font-size:13px; text-align:center; padding:30px;">Silakan pilih armada terlebih dahulu...</div>
    </div>

    <label>TOTAL SELURUH CASH TERKUMPUL (Rp)</label>
    <input type="text" id="uang_cash_disp" class="readonly-auto" placeholder="0" readonly>
    
    <label>TOTAL SELURUH TRANSFER (Rp)</label>
    <input type="text" id="uang_trf_disp" class="readonly-auto" placeholder="0" readonly>
</div>

<div class="section-title">💸 BIAYA OPERASIONAL & PERJALANAN</div>
<div class="card-form">
    <label style="color: #d97706;">SUMBER DANA KAS / NOTA AGEN:</label>
    <select id="sumber_agen" class="select-sumber">
        <option value="">-- Pilih Nota Dahulu Di Atas --</option>
    </select>

    <label>UANG JALAN (Rp)</label>
    <input type="text" id="exp_jalan" placeholder="0" oninput="formatRibuan(this)" inputmode="numeric">
    
    <label>BENSIN / SOLAR (Rp)</label>
    <input type="text" id="exp_bbm" placeholder="0" oninput="formatRibuan(this)" inputmode="numeric">
    
    <label>UANG BONGKAR (Rp)</label>
    <input type="text" id="exp_bongkar" placeholder="0" oninput="formatRibuan(this)" inputmode="numeric">
    
    <label style="color: #d97706;">BIAYA LAINNYA (KETERANGAN & NOMINAL)</label>
    <input type="text" id="exp_lain_ket" placeholder="Ket: misal Parkir / Tol / Ban Bocor">
    <input type="text" id="exp_lain_nom" placeholder="0" oninput="formatRibuan(this)" inputmode="numeric">

    <button class="btn-kirim" onclick="prosesSimpanDanKirimWA()">🚀 SIMPAN & KIRIM LAPORAN WA</button>
</div>

<script>
    const SB_URL = "https://fwmeuhqimqccjweabubx.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3bWV1aHFpbXFjY2p3ZWFidWJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNTE5MDUsImV4cCI6MjA5NjcyNzkwNX0.og_qhG-b2Lv1lx1Rvq3k0BvdgfdIbqG_XDWUuBCeIno";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let dataNotaCache = [];
    let tokoIdGlobal = null;

    function formatRibuan(elemen) {
        let val = elemen.value.replace(/[^0-9]/g, "");
        if (val === "") { elemen.value = ""; return; }
        elemen.value = parseInt(val).toLocaleString('id-ID');
    }

    function getAngka(str) {
        if(!str) return 0;
        let murni = str.replace(/[^0-9]/g, "");
        return parseInt(murni) || 0;
    }

    async function initHalaman() {
        try {
            // Cek sesi login aktif atau ambil data toko pertama jika halaman diakses publik
            const { data: sessionData } = await _supabase.auth.getSession();
            if (sessionData && sessionData.session) {
                const { data: profile } = await _supabase.from('profiles').select('toko_id').eq('id', sessionData.session.user.id).single();
                if (profile) tokoIdGlobal = profile.toko_id;
            }

            // Ambil profil toko untuk logo dan nama toko
            let queryToko = _supabase.from('toko').select('*');
            if (tokoIdGlobal) queryToko = queryToko.eq('id', tokoIdGlobal);
            const { data: tokoData } = await queryToko.limit(1);

            if (tokoData && tokoData.length > 0) {
                const toko = tokoData[0];
                tokoIdGlobal = toko.id; // set default jika belum ada

                if (toko.logo_url) {
                    document.getElementById('logoContainer').innerHTML = `<img src="${toko.logo_url}" alt="Logo Toko">`;
                }
                if (toko.nama_toko) {
                    document.getElementById('judulNamaToko').innerHTML = `${toko.nama_toko}`;
                }
                if (toko.warna_tema) {
                    document.documentElement.style.setProperty('--accent', toko.warna_tema);
                }
            }

            loadArmada();
        } catch (e) {
            console.error("Gagal inisialisasi:", e);
            loadArmada();
        }
    }

    async function loadArmada() {
        try {
            let query = _supabase.from('kendaraan').select('plat_nomor, jenis_kendaraan');
            if (tokoIdGlobal) query = query.eq('toko_id', tokoIdGlobal);
            
            const { data, error } = await query;
            if(error) return alert("Gagal memuat data armada: " + error.message);
            
            const sel = document.getElementById('selMobil');
            sel.innerHTML = '<option value="">-- Pilih Kendaraan --</option>';
            (data || []).forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.plat_nomor;
                opt.text = `${v.plat_nomor} (${v.jenis_kendaraan || 'Armada'})`;
                sel.appendChild(opt);
            });
        } catch(err) { alert("Error koneksi armada: " + err.message); }
    }

     async function cariNotaPengiriman() {
        const platArmada = document.getElementById('selMobil').value;
        if(!platArmada) {
            document.getElementById('notaList').innerHTML = '<div style="color:#7f8c8d; font-size:13px; text-align:center; padding:30px;">Silakan pilih armada terlebih dahulu...</div>';
            return;
        }

        try {
            // Hanya mengambil nota yang plat_nomor-nya SAMA PERSIS dengan armada yang dipilih di dropdown
            const { data, error } = await _supabase
                .from('transaksi_pengiriman')
                .select('*')
                .eq('plat_nomor', platArmada)
                .order('created_at', { ascending: false });
            
            if(error) throw error;

            dataNotaCache = data || [];
            const container = document.getElementById('notaList');
            container.innerHTML = '';
            
            if(dataNotaCache.length === 0) {
                container.innerHTML = `<div style="color:#7f8c8d; font-size:13px; text-align:center; padding:30px;">Tidak ada nota pengiriman untuk armada <b>${platArmada}</b>.</div>`;
                document.getElementById('uang_cash_disp').value = "0";
                document.getElementById('uang_trf_disp').value = "0";
                updateDropdownSumberAgen([]);
                return;
            }

            dataNotaCache.forEach(n => {
                const tglNota = n.tanggal ? new Date(n.tanggal).toLocaleDateString('id-ID', { weekday: 'short', day:'2-digit', month:'short' }) : 'Hari ini';
                const div = document.createElement('div');
                div.className = 'nota-item';
                div.innerHTML = `
                    <input type="checkbox" name="nota_pilih" value="${n.no_nota}" onchange="hitungOtomatis()">
                    <div class="nota-info">
                        <span class="txt-tgl">${tglNota} | Driver: ${n.driver_1 || '-'}</span>
                        <div class="baris-bawah">
                            <span class="txt-agen">${n.nama_agen || 'Tanpa Agen'}</span>
                            <span class="txt-nota">${n.no_nota} (Cash: Rp ${Number(n.bayar_cash||0).toLocaleString()})</span>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
            
            document.getElementById('uang_cash_disp').value = "0";
            document.getElementById('uang_trf_disp').value = "0";
            updateDropdownSumberAgen([]);
        } catch(err) { alert("Error memuat nota: " + err.message); }
    }


    function updateDropdownSumberAgen(detailBundel) {
        const selSumber = document.getElementById('sumber_agen');
        selSumber.innerHTML = '';
        
        if (detailBundel.length === 0) {
            selSumber.innerHTML = '<option value="">-- Pilih Nota Dahulu Di Atas --</option>';
            return;
        }

        detailBundel.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b.agen;              
            opt.text = `${b.agen} [Nota: ${b.nota}]`; 
            selSumber.appendChild(opt);
        });
    }

    function hitungOtomatis() {
        const checked = Array.from(document.querySelectorAll('input[name="nota_pilih"]:checked'));
        let totalCash = 0; let totalTrf = 0; let detailBundel = []; 
        let driverSet = new Set();
        
        checked.forEach(cb => {
            const item = dataNotaCache.find(x => x.no_nota === cb.value);
            if(item) {
                totalCash += Number(item.bayar_cash || 0);
                totalTrf += Number(item.bayar_transfer || 0);
                detailBundel.push({ agen: item.nama_agen || "Tanpa Agen", nota: item.no_nota, cash: item.bayar_cash, trf: item.bayar_transfer });
                
                if(item.driver_1) driverSet.add(item.driver_1);
            }
        });

        document.getElementById('uang_cash_disp').value = totalCash.toLocaleString('id-ID');
        document.getElementById('uang_trf_disp').value = totalTrf.toLocaleString('id-ID');
        
        updateDropdownSumberAgen(detailBundel);

        return { 
            detail: detailBundel, 
            driver: Array.from(driverSet).join(', ') || "Driver SBR",
            rawCash: totalCash,
            rawTrf: totalTrf
        };
    }

      async function prosesSimpanDanKirimWA() {
        const plat = document.getElementById('selMobil').value;
        const checked = Array.from(document.querySelectorAll('input[name="nota_pilih"]:checked'));
        const pilihanAgen = document.getElementById('sumber_agen').value;
        
        if(!plat) return alert("Validasi Gagal: Silakan pilih Unit Armada/Kendaraan!");
        if(checked.length === 0) return alert("Validasi Gagal: Anda belum mencentang Nota pengiriman!");
        if(!pilihanAgen) return alert("Validasi Gagal: Pilih Agen sebagai sumber pemotongan biaya operasional!");

        const calc = hitungOtomatis();

        const uJalan = getAngka(document.getElementById('exp_jalan').value);
        const uBBM = getAngka(document.getElementById('exp_bbm').value);
        const uBongkar = getAngka(document.getElementById('exp_bongkar').value);
        const ketLain = document.getElementById('exp_lain_ket').value || "-";
        const nomLain = getAngka(document.getElementById('exp_lain_nom').value);
        
        const totalExp = uJalan + uBBM + uBongkar + nomLain;
        const sisaCashBersih = calc.rawCash - totalExp;

        // Ambil nomor nota yang dicentang (digabung jika lebih dari satu)
        const listNoNotaStr = calc.detail.map(b => b.nota).join(', ');
        const listNamaAgenStr = calc.detail.map(b => b.agen).join(', ');

        try {
            // SIMPAN KE DATABASE SUPABASE (Tabel: rekap_laporan_driver)
            const { error: insertError } = await _supabase.from('rekap_laporan_driver').insert([{
                toko_id: tokoIdGlobal || null,
                no_nota: listNoNotaStr,
                nama_agen: listNamaAgenStr,
                nama_driver: calc.driver || "Driver",
                plat_nomor: plat,
                km_input: 0,
                uang_jalan: uJalan,
                uang_bbm: uBBM,
                uang_bongkar: uBongkar,
                lain_lain: nomLain,
                ket_lain_lain: ketLain,
                sumber_agen: pilihanAgen
            }]);

            if (insertError) throw insertError;

            // FORMAT PESAN WHATSAPP
            const tgl = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
            let pesan = "*REKAP LAPORAN PENGIRIMAN BARANG*\n";
            pesan += "------------------------------\n";
            pesan += "📅 *Tanggal:* " + tgl + "\n";
            pesan += "🚗 *Armada/Driver:* " + plat + "\n\n";
            
            pesan += "*DAFTAR NOTA TERKIRIM:*\n";
            calc.detail.forEach(b => {
                pesan += "▪ " + b.agen + " (" + b.nota + ")\n  - Cash: Rp " + Number(b.cash).toLocaleString('id-ID') + "\n  - TRF: Rp " + Number(b.trf).toLocaleString('id-ID') + "\n";
            });
            pesan += "\n*TOTAL PEMBAYARAN:*\n";
            pesan += "• Total Cash: Rp " + calc.rawCash.toLocaleString('id-ID') + "\n";
            pesan += "• Total Transfer: Rp " + calc.rawTrf.toLocaleString('id-ID') + "\n\n";

            pesan += "*PENGELUARAN JALAN:*\n";
            pesan += "• Sumber Kas: " + pilihanAgen + "\n"; 
            pesan += "• Uang Jalan: Rp " + uJalan.toLocaleString('id-ID') + "\n";
            pesan += "• BBM/Solar: Rp " + uBBM.toLocaleString('id-ID') + "\n";
            pesan += "• Bongkar: Rp " + uBongkar.toLocaleString('id-ID') + "\n";
            pesan += "• Lain-lain (" + ketLain + "): Rp " + nomLain.toLocaleString('id-ID') + "\n";
            
            pesan += "------------------------------\n";
            pesan += "• *Total Biaya:* Rp " + totalExp.toLocaleString('id-ID') + "\n";
            pesan += "• *SISA CASH BERSIH DISETOR:* Rp " + sisaCashBersih.toLocaleString('id-ID') + "\n\n";
            pesan += "_Laporan otomatis terekam sistem_";

            alert("✅ Data Laporan Berhasil Disimpan ke Database!");
            window.open("https://wa.me/?text=" + encodeURIComponent(pesan), '_blank');
            
            setTimeout(function() {
                location.reload();
            }, 1500);

        } catch (e) {
            alert("❌ Gagal menyimpan ke database: " + e.message);
        }
    }


    window.onload = initHalaman;
</script>
</body>
</html>
