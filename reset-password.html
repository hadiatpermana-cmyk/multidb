<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Kata Sandi - Store POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
        body{min-height:100vh;display:grid;place-items:center;background:#dde1e7;padding:20px}
        .content{width:100%;max-width:380px;padding:35px 30px;background:#dde1e7;border-radius:15px;box-shadow:-3px -3px 7px #ffffff73,2px 2px 5px rgba(94,104,121,.288);text-align:center}
        .title{font-size:25px;font-weight:700;margin-bottom:12px;color:#595959}.title span{color:#3498db}
        .desc{font-size:13px;color:#707782;margin-bottom:18px;line-height:1.6}
        .field{height:50px;width:100%;display:flex;position:relative;margin-top:15px}
        .field input{height:100%;width:100%;padding:0 15px 0 45px;outline:none;border:none;font-size:15px;background:#dde1e7;color:#595959;border-radius:25px;box-shadow:inset 2px 2px 5px #BABECC,inset -5px -5px 10px #ffffff73}
        .icon{position:absolute;color:#595959;width:45px;height:100%;line-height:50px;left:0;top:0;text-align:center;pointer-events:none}
        .btn-auth{margin:20px 0 10px;width:100%;min-height:50px;font-size:15px;font-weight:600;background:#dde1e7;border-radius:25px;border:none;cursor:pointer;color:#595959;box-shadow:2px 2px 5px #BABECC,-5px -5px 10px #ffffff73}
        .btn-auth:disabled{opacity:.6;cursor:wait}
        .msg-box{padding:12px;border-radius:10px;margin-bottom:15px;font-size:13px;display:none;font-weight:600;overflow-wrap:anywhere}
        .msg-error{background:#ffe3e3;color:#c53030;box-shadow:inset 1px 1px 3px #e0b0b0,inset -2px -2px 5px #fff}
        .msg-success{background:#e3f9e5;color:#22543d;box-shadow:inset 1px 1px 3px #b0e0b5,inset -2px -2px 5px #fff}
        .sign-up{margin-top:15px;font-size:14px}a{color:#3498db;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
        .hint{display:block;text-align:left;padding:8px 10px 0;color:#7f8c8d;font-size:11px}
    </style>
    <link rel="stylesheet" href="gloss.css">
</head>
<body>
<div class="content">
    <div class="title">Ganti <span>Kata Sandi</span></div>
    <p class="desc">Buat kata sandi baru untuk akun Store POS Anda.</p>
    <div id="msgBox" class="msg-box"></div>
    <form id="resetForm">
        <div class="field"><input type="password" id="passwordBaru" placeholder="Kata sandi baru" minlength="6" autocomplete="new-password" required><span class="icon fas fa-lock"></span></div>
        <div class="field"><input type="password" id="konfirmasiPassword" placeholder="Ulangi kata sandi baru" minlength="6" autocomplete="new-password" required><span class="icon fas fa-lock"></span></div>
        <small class="hint">Minimal 6 karakter. Gunakan kata sandi yang kuat dan tidak mudah ditebak.</small>
        <button class="btn-auth" id="btnSimpan" type="submit">Simpan Kata Sandi Baru</button>
    </form>
    <div class="sign-up"><a href="index.html">Kembali ke halaman login</a></div>
</div>
<script>
    const SB_URL = "https://brxwhppefkycvghjqklh.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeHdocHBlZmt5Y3ZnaGpxa2xoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzA4MzUsImV4cCI6MjA5OTYwNjgzNX0.aRymB9Fybz0UsiR8blMvun608m5EPxNk29UlF5PSjhg";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    const msgBox = document.getElementById("msgBox");
    const form = document.getElementById("resetForm");
    const btn = document.getElementById("btnSimpan");
    let sesiSiap = false;

    function tampilkanPesan(teks, tipe) {
        msgBox.textContent = teks;
        msgBox.style.display = "block";
        msgBox.className = "msg-box " + (tipe === "error" ? "msg-error" : "msg-success");
    }

    async function cekSesiReset() {
        const { data, error } = await _supabase.auth.getSession();
        if (error) {
            tampilkanPesan("Tautan reset tidak valid atau sudah kedaluwarsa. Silakan minta tautan baru dari halaman login.", "error");
            btn.disabled = true;
            return;
        }
        if (data && data.session) {
            sesiSiap = true;
            return;
        }
        tampilkanPesan("Sesi reset tidak ditemukan. Buka tautan terbaru dari email Anda, atau minta tautan reset baru.", "error");
        btn.disabled = true;
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();
        const password = document.getElementById("passwordBaru").value;
        const konfirmasi = document.getElementById("konfirmasiPassword").value;

        if (!sesiSiap) return tampilkanPesan("Sesi reset belum siap. Buka kembali tautan dari email reset terbaru.", "error");
        if (password.length < 6) return tampilkanPesan("Kata sandi minimal 6 karakter.", "error");
        if (password !== konfirmasi) return tampilkanPesan("Konfirmasi kata sandi tidak sama.", "error");

        btn.disabled = true;
        btn.textContent = "Menyimpan...";
        try {
            const { error } = await _supabase.auth.updateUser({ password });
            if (error) throw error;
            tampilkanPesan("Kata sandi berhasil diperbarui. Silakan login menggunakan kata sandi baru.", "success");
            form.reset();
            sesiSiap = false;
            setTimeout(async () => {
                await _supabase.auth.signOut();
                window.location.href = "index.html";
            }, 2200);
        } catch (e) {
            tampilkanPesan("Gagal memperbarui kata sandi: " + e.message, "error");
            btn.disabled = false;
            btn.textContent = "Simpan Kata Sandi Baru";
        }
    });

    cekSesiReset();
</script>
</body>
</html>
